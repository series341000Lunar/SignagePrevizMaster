<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self'; style-src 'self'; img-src 'self' file: blob: data:; connect-src 'self' file: ws://localhost:34100; object-src 'none'; base-uri 'none'; frame-src 'none'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LUUX Signage Previz — Block 3C</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header>
      <div>
        <h1>LUUX SIGNAGE PREVIZ — BLOCK 3C</h1>
        <p>Full-resolution Photoshop link · Plane and actual GLB signage surfaces</p>
      </div>
      <div id="full-resolution-badge" class="badge pending">WAITING</div>
    </header>

    <section class="controls" aria-label="Viewer controls">
      <button id="view-2d-button" class="view-button active" type="button">2D VIEW</button>
      <button id="view-3d-plane-button" class="view-button" type="button">3D PLANE</button>
      <button id="view-site-3d-button" class="view-button" type="button">SITE 3D</button>
      <span class="control-divider" aria-hidden="true"></span>
      <label class="site-control" hidden>
        World
        <select id="site-world-select" aria-label="Site world">
          <option value="world3d">3D WORLD</option>
          <option value="legacy2d">LEGACY 2D WORLD</option>
        </select>
      </label>
      <label class="site-control" hidden>
        Mapping
        <select id="site-mapping-select" aria-label="Site mapping mode">
          <option value="normal">NORMAL</option>
          <option value="anamorphic">ANAMORPHIC (NONE)</option>
        </select>
      </label>
      <label class="site-control" hidden>
        Scene
        <select id="site-scene-select" aria-label="Legacy scene" disabled></select>
      </label>
      <button id="legacy-camera-lock-button" class="site-control camera-lock-button locked" type="button" aria-pressed="true" hidden>CAMERA LOCKED</button>
      <span class="control-divider site-control" aria-hidden="true" hidden></span>
      <label>
        Source
        <select id="source-select" aria-label="Source image"></select>
      </label>
      <button id="fit-button" type="button">FIT</button>
      <button id="one-button" type="button">1:1</button>
      <button id="two-button" type="button">200%</button>
      <button id="four-button" type="button">400%</button>
      <button id="filter-button" type="button">NORMAL</button>
      <button id="reload-button" type="button">RELOAD</button>
      <span class="control-divider" aria-hidden="true"></span>
      <button id="navigate-button" class="mode-button active" type="button">NAVIGATE</button>
      <button id="point-button" class="mode-button" type="button" disabled>POINT</button>
      <button id="clear-pointer-button" type="button" disabled>CLEAR POINTER</button>
      <span id="link-status" class="link-status disconnected">Photoshop Link: DISCONNECTED</span>
      <span id="zoom-readout">Zoom —</span>
    </section>

    <main>
      <section id="viewer" aria-label="Full-resolution texture viewer">
        <canvas id="three-canvas"></canvas>
        <div id="pointer-marker" class="pointer-marker" aria-hidden="true">
          <span class="pointer-marker-ring"></span>
          <span class="pointer-marker-label">POINT</span>
        </div>
        <div id="drag-hint">2D NAVIGATE: Left/Middle drag: pan · Wheel: zoom</div>
      </section>

      <aside>
        <h2>Runtime diagnostics</h2>
        <dl id="diagnostics"></dl>
        <div id="runtime-status" class="status">Loading source…</div>
      </aside>
    </main>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
